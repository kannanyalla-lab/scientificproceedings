# Runs the whole site on one server:
#   web     - the Next.js site
#   db      - Postgres (data kept in the "dbdata" volume)
#   caddy   - public web server; gets and renews the HTTPS certificate by itself
#   backup  - copies the database and uploaded files to ./backups every night
# Settings come from deploy/.env, which deploy/install.sh writes on the server.
name: ksp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ksp
      POSTGRES_DB: ksp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/install.sh first}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksp -d ksp"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ..
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    image: ksp-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ksp:${POSTGRES_PASSWORD}@db:5432/ksp
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      UPLOAD_DIR: /app/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/app/uploads
      - appdata:/app/.data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      EXTRA_DOMAINS: ${EXTRA_DOMAINS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads:/uploads:ro
      - appdata:/appdata:ro
    entrypoint: ["sh", "/backup.sh", "loop"]

volumes:
  dbdata:
  uploads:
  appdata:
  caddydata:
  caddyconfig:
